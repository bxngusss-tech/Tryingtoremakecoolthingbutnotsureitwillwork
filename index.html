<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hopefully this works | Unblocked Games</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Background (White, Grey, Black) */
        body {
            background: linear-gradient(-45deg, #ffffff, #888888, #222222, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        header p {
            color: #cccccc;
            font-size: 1.1rem;
        }

        /* Game Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
        }

        /* Pop-up White Outlined Game Cards */
        .game-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 320px;
        }

        /* Hover effect: Pops up and glows */
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }

        .game-thumbnail {
            width: 100%;
            height: 140px;
            background: #333333;
            border: 1px solid #555555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888888;
            margin-bottom: 1rem;
        }

        .game-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        /* Play Button */
        .play-btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: auto;
        }

        .play-btn:hover {
            background: #cccccc;
        }

        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>hopefully this works</h1>
        <p>Your gateway to unblocked gaming bliss.</p>
    </header>

    <main class="game-grid">
        <div class="game-card">
            <div class="game-thumbnail">Placeholder Image</div>
            <h3>Game Title 1</h3>
            <a href="https://example.com/game1" class="play-btn" target="_blank">Play Now</a>
        </div>

        <div class="game-card">
            <div class="game-thumbnail">Placeholder Image</div>
            <h3>Game Title 2</h3>
            <a href="https://example.com/game2" class="play-btn" target="_blank">Play Now</a>
        </div>

        <div class="game-card">
            <div class="game-thumbnail">Placeholder Image</div>
            <h3>Game Title 3</h3>
            <a href="https://example.com/game3" class="play-btn" target="_blank">Play Now</a>
        </div>

        <div class="game-card">
            <div class="game-thumbnail">Placeholder Image</div>
            <h3>Game Title 4</h3>
            <a href="https://example.com/game4" class="play-btn" target="_blank">Play Now</a>
        </div>
    </main>


</body>
</html>
