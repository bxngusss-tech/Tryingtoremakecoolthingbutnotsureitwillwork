<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #e5e5e5; 
            color: #111111;
        }

        /* Top Navigation Bar */
        .top-navbar {
            background-color: #111111; 
            width: 100%;
            display: flex;
            justify-content: flex-start;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Tab styling */
        .nav-tab {
            color: #ffffff;
            padding: 15px 25px;
            font-weight: bold;
            text-decoration: none;
            background-color: ##111111; 
            display: inline-block;
        }

        /* Container for launcher box */
        .content-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 3px solid #111111;
            border-radius: 8px;
            box-shadow: 6px 6px 0px #111111; 
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #444444;
        }

        /* Launch Button */
        .launch-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 15px 40px;
            background-color: #0066cc;
            color: white;
            border: 3px solid #111111;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #111111;
        }

        .launch-btn:hover {
            background-color: #004da6;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="index.html" class="nav-tab">hopefully this works</a>
            <a href="apps.html" class="nav-tab">apps that hopefully work</a>
            <a href="launch.html" class="nav-tab">Dingus Secrets</a>
    </div>

    <div class="content-container">
        <h1>Dingus Launcher</h1>
        <p>Click below to launch the Dingus..</p>
        <button id="startBtn" class="launch-btn">Launch Dingus</button>
    </div>

    <script>
        const startButton = document.getElementById('startBtn');

        startButton.addEventListener('click', function() {
            const newWindow = window.open('about:blank', '_blank');

            if (newWindow) {
                // The complete dashboard structure injected into about:blank
                const dashboardHTML = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <title>hopefully this works</title>
                        <style>
                            body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #e5e5e5; }
                            .top-navbar { background-color: #111111; width: 100%; display: flex; position: sticky; top: 0; margin: -20px -20px 20px -20px; }
                            .nav-tab { color: #ffffff; padding: 15px 25px; font-weight: bold; text-decoration: none; background-color: #0066cc; display: inline-block; cursor: pointer; }
                            
                          
                            .games-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 20px 0; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
                            
                        
                            .game-card { text-decoration: none; color: #111111; background-color: #ffffff; border: 3px solid #111111; border-radius: 8px; padding: 25px 15px; text-align: center; display: block; box-shadow: 4px 4px 0px #111111; cursor: pointer; font-weight: bold; }
                            
                          
                            #gameContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; border: none; }
                            
                         
                            #backBtn { display: none; position: fixed; top: 15px; right: 15px; z-index: 10000; background: red; color: white; border: 2px solid white; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
                        </style>
                    </head>
                    <body>

                        <div class="top-navbar">
                            <div class="nav-tab" onclick="location.reload()">hopefully this works</div>
                        </div>

                      
                        <button id="backBtn" onclick="closeGame()">Back to Games</button>
                        
                      
                        <iframe id="gameContainer"></iframe>

                     
                        <div class="games-container">
                            <div class="game-card" onclick="loadGame('geometrydash.html')">Geometry Dash</div>
                            <div class="game-card" onclick="loadGame('clustertruck.html')">Clustertruck</div>
                            <div class="game-card" onclick="loadGame('drivemad.html')">Drive Mad</div>
                            <div class="game-card" onclick="loadGame('bitlife.html')">Bitlife</div>
                            <div class="game-card" onclick="loadGame('cookieclicker.html')">Cookie Clicker</div>
                            <div class="game-card" onclick="loadGame('ducklife.html')">Duck Life</div>
                            <div class="game-card" onclick="loadGame('plytrack.html')">Polytrack</div>
                            <div class="game-card" onclick="loadGame('run3.html')">Run3</div>
                            <div class="game-card" onclick="loadGame('bottleflip.html')">Bottleflip</div>
                            <div class="game-card" onclick="loadGame('escaperoad.html')">Escape Road</div>
                        </div>

                        <script>
                          
                            function loadGame(url) {
                                const frame = document.getElementById('gameContainer');
                                const btn = document.getElementById('backBtn');
                                
                                frame.src = url;
                                frame.style.display = 'block';
                                btn.style.display = 'block';
                            }

                         
                            function closeGame() {
                                const frame = document.getElementById('gameContainer');
                                const btn = document.getElementById('backBtn');
                                
                                frame.src = 'about:blank';
                                frame.style.display = 'none';
                                btn.style.display = 'none';
                            }
                        <\/script>
                    </body>
                    </html>
                `;

                newWindow.document.open();
                newWindow.document.write(dashboardHTML);
                newWindow.document.close();
            }
        });
    </script>

</body>
</html>
