<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hopefully this works - Launcher</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #e5e5e5; /* Matching your main dashboard gray */
            color: #111111;
        }

        /* Top Navigation Bar */
        .top-navbar {
            background-color: #111111; 
            width: 100%;
            display: flex;
            justify-content: flex-start;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Tab styling matching your main page */
        .nav-tab {
            color: #ffffff;
            padding: 15px 25px;
            font-weight: bold;
            text-decoration: none;
            background-color: #0066cc; 
            display: inline-block;
        }

        /* Container for page content */
        .content-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border: 3px solid #111111;
            border-radius: 8px;
            box-shadow: 6px 6px 0px #111111; /* Matching your high-contrast retro shadow */
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #444444;
        }

        /* Main Big Launch Button */
        .launch-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 15px 40px;
            background-color: #0066cc;
            color: white;
            border: 3px solid #111111;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #111111;
        }

        .launch-btn:hover {
            background-color: #004da6;
        }
    </style>
</head>
<body>

    <!-- Top Tab Row -->
    <div class="top-navbar">
        <a href="index.html" class="nav-tab">hopefully this works</a>
    </div>

    <!-- Central Launcher Box -->
    <div class="content-container">
        <h1>Dashboard Launcher</h1>
        <p>Click the button below to cleanly open your games dashboard inside an unblocked, stealthy <b>about:blank</b> window tab.</p>
        
        <!-- Direct click gesture ensures pop-up blocker approval -->
        <button id="startBtn" class="launch-btn">Launch Dashboard</button>
    </div>

    <!-- JavaScript Functionality -->
    <script>
        const startButton = document.getElementById('startBtn');

        startButton.addEventListener('click', function() {
            // Open the blank destination window
            const newWindow = window.open('about:blank', '_blank');

            if (newWindow) {
                // HTML structure to inject into the blank window
                const dashboardHTML = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <title>hopefully this works</title>

                            .games-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
                            .games-container a { text-decoration: none; color: #111111; background-color: #ffffff; border: 3px solid #111111; border-radius: 8px; padding: 25px 15px; text-align: center; display: block; box-shadow: 4px 4px 0px #111111; }
                        </style>
                    </head>
                    <body>
                        <div class="top-navbar">
                            <a href="#" class="nav-tab">hopefully this works</a>

                        <div class="games-container">

                            <a href="plytrack.html"><b>Polytrack</b></a>
                            <a href="run3.html"><b>Run3</b></a>
                            <a href="bottleflip.html"><b>Bottleflip</b></a>
                            <a href="escaperoad.html"><b>Escape Road</b></a>
                        </div>
                    </body>
                    </html>
                `;

                // Inject code completely into the blank window doc
                newWindow.document.open();
                newWindow.document.write(dashboardHTML);
                newWindow.document.close();
            }
        });
    </script>

</body>
</html>
