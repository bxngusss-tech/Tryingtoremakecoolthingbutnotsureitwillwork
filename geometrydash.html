<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Game | hopefully this works</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Matching Animated Background (White, Grey, Black) */
        body {
            background: linear-gradient(-45deg, #ffffff, #888888, #222222, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation / Header Actions */
        .nav-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .game-title {
            font-size: 1.8rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            font-weight: 600;
        }

        /* Shared Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* White Outlined Iframe Container */
        .iframe-container {
            width: 100%;
            max-width: 1000px;
            height: 600px; /* Standard gameplay height */
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            margin-bottom: 1.5rem;
        }

        /* The actual iframe game canvas */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        /* Bottom Controls Bar */
        .controls-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <header class="nav-container">
        <a href="index.html" class="btn">← Back to Home</a>
        <h2 class="game-title">Game Title Placeholder</h2>
        <div style="width: 130px;"></div> </header>

    <main class="iframe-container" id="gameWindow">
        <iframe 
            src="https://example.com/inner-game-link" 
            class="game-frame" 
            allowfullscreen="true"
            scrolling="no">
        </iframe>
    </main>

    <footer class="controls-bar">
        <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
    </footer>

    <script>
        // Fullscreen Toggle Script
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const gameWindow = document.getElementById('gameWindow');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                gameWindow.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>

</body>
</html>
